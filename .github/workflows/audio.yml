name: audio
on:
  push:
    branches: [media-tmp]
    paths: [beatriz.wav]
permissions:
  contents: write
jobs:
  a:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          (pip install -q faster-whisper && python tr3.py) > log.txt 2>&1 || true
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add -A; git commit -qm check; git push -q
