name: dl
on:
  push:
    branches: [media-tmp]
    paths: [urls.txt]
permissions:
  contents: write
jobs:
  a:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p media; i=0
          while read -r u; do i=$((i+1)); curl -sSL "$u" -o media/f$i.png; done < urls.txt
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add media; git commit -qm m; git push -q
