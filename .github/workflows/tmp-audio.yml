name: tmp-audio
on:
  push:
    branches: [tmp-audio]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-audio
      - name: Download music
        run: |
          curl -sSL -o musique.mp3 "https://storage.googleapis.com/xi-backend/database/workspace/391f11fc52914d9d90ef0f5ece76425d/content_generation/gEQfN3xQnbExiGyzfIVl/ao2B180vRDOEicNoVBh4/content.mp3?X-Goog-Algorithm=GOOG4-RSA-SHA256&X-Goog-Credential=xi-backend-prod%40xi-labs.iam.gserviceaccount.com%2F20261020%2Fauto%2Fstorage%2Fgoog4_request&X-Goog-Date=20261020T100629Z&X-Goog-Expires=7200&X-Goog-SignedHeaders=host&X-Goog-"
          ls -la musique.mp3
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add musique.mp3
          git commit -m "musique temporaire"
          git push origin tmp-audio
