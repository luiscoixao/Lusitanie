name: words
on:
  push:
    branches: [media-tmp]
    paths: [seg.wav]
permissions:
  contents: write
jobs:
  w:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          (pip install -q faster-whisper && python tr.py) > log.txt 2>&1 || true
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git rm -q --cached seg.wav || true; rm -f seg.wav
          git add -A; git commit -qm words; git push -q
