<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
:root{--cream:#f5f0e8;--ink:#1a1410;--rouge:#c0392b;--or:#b8960c;--gris:#7a7268;--pale:#ede8de;}
body{background:var(--cream);color:var(--ink);font-family:'Georgia',serif;min-height:100vh;}
.masthead{border-bottom:3px double var(--ink);padding:1.2rem 2rem 1rem;display:flex;align-items:center;justify-content:space-between;gap:1rem;}
.masthead-brand{font-family:monospace;font-size:0.65rem;letter-spacing:0.22em;text-transform:uppercase;color:var(--gris);}
.masthead-title{font-size:clamp(2rem,6vw,3.8rem);font-weight:900;letter-spacing:-0.02em;text-align:center;line-height:1;font-family:Georgia,serif;}
.masthand-title span{color:var(--rouge);}
.masthead-title span{color:var(--rouge);}
.content{max-width:780px;margin:0 auto;padding:3rem 2rem 4rem;text-align:center;}
h1{font-family:Georgia,serif;font-size:2rem;font-weight:700;margin-bottom:1.5rem;}
.deck{font-size:1.1rem;font-style:italic;color:var(--gris);margin-bottom:3rem;line-height:1.7;}
.contact-bloc{background:var(--pale);padding:2.5rem;margin-bottom:2rem;}
.contact-label{font-family:monospace;font-size:0.55rem;letter-spacing:0.3em;text-transform:uppercase;color:var(--or);margin-bottom:0.8rem;}
.contact-value{font-size:1.1rem;font-weight:700;}
.contact-value a{color:var(--rouge);text-decoration:none;}
.social-links{display:flex;gap:2rem;justify-content:center;margin-top:2rem;flex-wrap:wrap;}
.social-link{font-family:monospace;font-size:0.6rem;letter-spacing:0.25em;text-transform:uppercase;color:var(--gris);text-decoration:none;padding:0.7rem 1.5rem;border:1px solid var(--gris);}
.social-link:hover{color:var(--ink);border-color:var(--ink);}
p{font-size:1rem;line-height:1.8;margin-bottom:1rem;color:var(--gris);}
footer{border-top:3px double var(--ink);padding:2rem;display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;}
footer .brand{font-family:Georgia,serif;font-size:1.6rem;font-weight:900;}
footer .brand span{color:var(--rouge);}
footer .back{font-family:monospace;font-size:0.55rem;letter-spacing:0.2em;text-transform:uppercase;color:var(--gris);text-decoration:none;}
</style>

  <div class="masthead-title">LUSI<span>TANIE</span></div>
  <div></div>
</header>

<div class="content">
  <h1>Nous contacter</h1>
  <p class="deck">Pour toute question, suggestion, partenariat ou collaboration éditoriale.</p>

  <div class="contact-bloc">
    <div class="contact-label">✦ Email</div>
    <div class="contact-value"><a href="mailto:contact@lusitanie.blog">contact@lusitanie.blog</a></div>
  </div>

  <div class="social-links">
    <a href="https://facebook.com/lusitanie" target="_blank" class="social-link">Facebook</a>
    <a href="https://instagram.com/lusitanie.photo" target="_blank" class="social-link">Instagram</a>
  </div>

  <p style="margin-top:3rem;">Lusitanie est un magazine indépendant. Nous répondons à tous les messages dans les meilleurs délais.</p>
</div>

  <div class="brand">LUSI<span>TANIE</span></div>
</footer>
